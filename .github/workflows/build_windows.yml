name: Build Windows exe

on:
  workflow_dispatch:      # manual "Run workflow" button
  push:
    tags: ["v*"]          # also build when you push a tag like v1.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract
        shell: pwsh
        run: choco install tesseract --no-progress -y

      - name: Add French language data
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" `
            -OutFile "$dir\fra.traineddata"
          Get-ChildItem $dir

      - name: Build exe
        shell: cmd
        run: call build.bat

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ManuscritOCR-windows
          path: dist/ManuscritOCR.exe
