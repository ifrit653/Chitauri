name: Build Windows exe

on:
  workflow_dispatch:      # manual "Run workflow" button
  push:
    tags: ["v*"]          # also build when you push a tag like v1.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract and bundle it with French data
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) {
            Get-ChildItem "C:\Program Files"
            throw "tesseract.exe not found in $src"
          }
          New-Item -ItemType Directory -Force "$src\tessdata" | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" `
            -OutFile "$src\tessdata\fra.traineddata"
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse -Force
          Get-ChildItem tesseract\tessdata -Filter *.traineddata |
            Where-Object { $_.BaseName -notin @("fra", "eng") } |
            Remove-Item
          Get-ChildItem tesseract\tessdata

      - name: Install Python packages
        shell: pwsh
        run: pip install pytesseract pillow python-docx pyinstaller

      - name: Build exe
        shell: pwsh
        run: pyinstaller --noconsole --onefile --name ManuscritOCR --add-data "tesseract;tesseract" client_ocr.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ManuscritOCR-windows
          path: dist/ManuscritOCR.exe
